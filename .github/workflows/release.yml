name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # setup-go caches both the module cache (GOMODCACHE) and the build
      # cache (GOCACHE), keyed on go.sum, so dependencies and compiled
      # packages for all five targets are reused between runs.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

      # Cross-compiles linux/amd64, linux/arm64, darwin/amd64, darwin/arm64
      # and windows/amd64 into dist/ with CGO disabled (see Makefile).
      - name: Build
        run: make release

      - name: Checksums
        working-directory: dist
        run: sha256sum bible-* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
